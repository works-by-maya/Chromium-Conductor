# conductor.conf - Configuration for Chromium Conductor/ungoogled-chromium macOS build
#
# Copy this file to conductor.conf and customize as needed.
# This file is sourced by conductor.sh, so use bash syntax.
#

# =============================================================================
# VERSION
# =============================================================================
#
# There is intentionally no committed version here. Conductor builds the latest
# upstream ungoogled-chromium-macos release by default and records the version it
# selected in version.txt (generated, local, gitignored). The source of truth is
# the latest upstream release -- not whatever happened to be committed in this
# repo. Setting VERSION here is not required and is not used for normal builds.

# =============================================================================
# OPTIONAL
# =============================================================================

# Build number (CFBundleVersion)
# Default: extracted from VERSION (e.g., "143.0.7499.40" -> "7499.40")
# BUILD="7499.40"

# App name (CFBundleName)
# Default: Chromium
# APP_NAME="Chromium"

# Bundle identifier (CFBundleIdentifier)
# Default: org.chromium.Chromium
# Use a custom one for fork builds to avoid conflicts
# BUNDLE_ID="com.example.my-chromium"

# Target architecture: arm64 or x64
# Default: arm64
# ARCH="arm64"

# Display name suffix (appended to CFBundleDisplayName)
# Useful for distinguishing fork builds (e.g., " Dev", " Nightly")
# Default: empty (no suffix)
# DISPLAY_NAME_SUFFIX=" (Fork)"

# =============================================================================
# CODE SIGNING (Optional)
# =============================================================================
#
# SECURITY WARNING: conductor.conf is tracked by git. Do NOT commit real
# credentials. PROD_MACOS_NOTARIZATION_PWD below is an app-specific password
# (a real secret) -- filling these in here and committing leaks it into history.
#
# Safer: leave them commented and pass them as environment variables instead.
# conductor.sh reads each of these from the environment when it is already set,
# so exporting them in your shell keeps every secret out of the repo:
#
#     export MACOS_CERTIFICATE_NAME="Developer ID Application: Your Name (TEAMID)"
#     export PROD_MACOS_NOTARIZATION_APPLE_ID="you@example.com"
#     export PROD_MACOS_NOTARIZATION_TEAM_ID="TEAMID"
#     export PROD_MACOS_NOTARIZATION_PWD="app-specific-password"
#     ./conductor.sh
#
# If you do set them below instead, do not commit that change.

# Developer ID certificate name for code signing
# If not set, signing is skipped
# MACOS_CERTIFICATE_NAME="Developer ID Application: Your Name (TEAMID)"

# Notarization credentials (required if signing)
# PROD_MACOS_NOTARIZATION_APPLE_ID="your@email.com"
# PROD_MACOS_NOTARIZATION_TEAM_ID="TEAMID"
# PROD_MACOS_NOTARIZATION_PWD="app-specific-password"
